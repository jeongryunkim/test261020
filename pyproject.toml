[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "langgraph-cli[inmem]>=0.4.35",
    "langgraph-api>=0.11",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.uv]
# uv가 관리하는 파이썬(AppData\Roaming\uv\python)은 애플리케이션 제어 정책에 막혀 있어
# 시스템에 설치된 파이썬만 쓰도록 고정합니다.
python-preference = "only-system"
